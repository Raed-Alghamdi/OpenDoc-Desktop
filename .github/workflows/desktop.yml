name: Desktop

# Builds the opendoc-desktop installers: pacman, deb, rpm and AppImage on Linux; zip and dmg for Apple Silicon Macs (Intel Macs are not built).
# A `desktop-v<version>-<build>` tag (for example desktop-v0.6.1-2) also creates a DRAFT release holding every file; publishing it
# stays a manual step. Other runs build and keep the files as artifacts for 5 days, and publish nothing.
# upstream-watch.yml calls this workflow (workflow_call) for the merge it prepared: `ref` is the commit to build, `build` its build
# number, and `release_tag` the release to leave as a draft (a rehearsal passes a `dryrun-` tag and `prerelease`). The call never
# publishes; upstream-watch decides that after verify has also finished.
on:
  push:
    tags: ['desktop-v*']
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
      - 'scripts/pack.mjs'
  workflow_dispatch:
    inputs:
      build:
        description: Build number for this run (a whole number)
        default: '1'
  workflow_call:
    inputs:
      ref:
        description: The commit to build (empty means the caller's own)
        type: string
        default: ''
      build:
        description: Build number for this run (a whole number)
        type: string
        default: '1'
      release_tag:
        description: When set, leave a draft release with this tag (desktop-v<version>-<build>) after every job is green
        type: string
        default: ''
      prerelease:
        description: Mark that draft release as a pre-release (rehearsals)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      # The build number reaches the runtime, the package revisions, the file names and the update metadata.
      - name: Read the version and build number
        id: meta
        env:
          INPUT_BUILD: ${{ inputs.build }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node desktop/runtime/ci-meta.mjs
      # rpm for the rpm package, libarchive-tools for bsdtar (fpm builds the pacman package with it), xvfb for the smoke test.
      - run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools xvfb
      - name: Build the runtime
        run: node desktop/runtime/build.mjs --build "${{ steps.meta.outputs.build }}"
      - name: Test the runtime and the metadata scripts
        run: |
          node --test "desktop/tests/packaging/*.test.mjs"
          node --test desktop/tests/smoke/runtime.test.mjs
      # The shell's unit tests (no display needed). Here /bin/sh is dash, which the launcher and the host's watcher shell must run under.
      - name: Test the shell
        run: node desktop/tests/shell/run.mjs --unit
      - name: Build the installers
        run: node desktop/runtime/dist.mjs ${{ steps.meta.outputs.stub }} --linux pacman deb rpm AppImage --publish never
      # The unpacked app: the agent integrations with their dot folders, through the source check script. --release also fails a
      # test build (OPENDOC_DESKTOP_TEST_BUILD=1 puts opendocTestBuild in the app's package.json); this job never makes one.
      - name: Check the unpacked app
        run: node desktop/tests/packaging/check-packaged.mjs --require linux --release
      # Each installer: version, build number, update files, the integrations and the design pack file type.
      - name: Check the installers
        run: node desktop/tests/packaging/check-artifacts.mjs --require-rpm
      # Every installer's app.asar (deb, rpm, pacman, AppImage) must be free of the test build mark, before anything is uploaded.
      - name: Check that no installer is a test build
        run: node desktop/tests/packaging/check-release.mjs desktop/dist
      - name: Test the runtime inside the unpacked app
        env:
          OPENDOC_RUNTIME: ${{ github.workspace }}/desktop/dist/linux-unpacked/resources/runtime
          OPENDOC_ELECTRON: ${{ github.workspace }}/desktop/dist/linux-unpacked/opendoc-desktop
        run: node --test desktop/tests/smoke/runtime.test.mjs
      # Ubuntu 24.04 stops unprivileged user namespaces, which the unpacked app's sandbox needs (no setuid chrome-sandbox there).
      # This runner is thrown away after the job.
      - name: Allow the app sandbox on this runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The packaged app (production fuses), driven on a virtual display: library, PDF, comment, export, `opendoc --version`, quit.
      - name: Smoke test the packaged app
        run: node desktop/tests/smoke/run.mjs
      - name: Sizes
        run: ls -l desktop/dist | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux
          path: |
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/*.pacman
            desktop/dist/*.AppImage
            desktop/dist/*.blockmap
            desktop/dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 5

  # The agent plugin files (desktop/integrations/). Needs Node 24 only: no install. The pull_request path filter above
  # (desktop/**) covers the folder; the installer jobs check the packaged copy as well.
  integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check the plugin files
        run: node desktop/integrations/check.mjs

  mac:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      # The build number reaches the runtime, the package revisions, the file names and the update metadata.
      - name: Read the version and build number
        id: meta
        env:
          INPUT_BUILD: ${{ inputs.build }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node desktop/runtime/ci-meta.mjs
      - name: Build the runtime
        run: node desktop/runtime/build.mjs --build "${{ steps.meta.outputs.build }}"
      - name: Test the runtime and the metadata scripts
        run: |
          node --test "desktop/tests/packaging/*.test.mjs"
          node --test desktop/tests/smoke/runtime.test.mjs
      # The shell's unit tests (no display needed), with the same command as on Linux.
      - name: Test the shell
        run: node desktop/tests/shell/run.mjs --unit
      # Ad-hoc signed (identity "-", no notarization), as the config says; the first open on a Mac needs "Open Anyway".
      - name: Build zip and dmg
        run: node desktop/runtime/dist.mjs ${{ steps.meta.outputs.stub }} --mac zip dmg --arm64 --publish never
      # The unpacked app: the agent integrations with their dot folders and the design pack document type, which must not claim
      # plain ZIP files.
      - name: Check the unpacked app
        run: node desktop/tests/packaging/check-packaged.mjs --require mac --release
      # The zip's app.asar must be free of the test build mark, before anything is uploaded (the dmg holds the same app).
      - name: Check that no installer is a test build
        run: node desktop/tests/packaging/check-release.mjs desktop/dist
      # The packaged app (production fuses) in the runner's own session: library, PDF, comment, export, `opendoc --version`, quit.
      - name: Smoke test the packaged app
        run: node desktop/tests/smoke/run.mjs
      - name: Sizes
        run: ls -l desktop/dist | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-mac-arm64
          path: |
            desktop/dist/*.zip
            desktop/dist/*.dmg
            desktop/dist/*.blockmap
            desktop/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 5

  # A draft release, for a desktop-v tag or for a call from upstream-watch.yml that names one. Nothing is published here; a maintainer
  # reads the draft and publishes by hand, or upstream-watch publishes it when every gate allows.
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v') || (inputs.release_tag && inputs.release_tag != '')
    needs: [linux, mac]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # rpm for rpm2cpio and libarchive-tools for bsdtar, which the check below reads the packages with.
      - run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
      # One macOS build, so its update metadata is the release's (the updater reads release/latest-mac.yml).
      - name: Place the macOS update metadata
        run: mv release/desktop-mac-arm64/latest-mac.yml release/latest-mac.yml
      # Nothing is published with the test build mark: it makes the app honour test switches and a plain-http update feed. This reads
      # the app archive of every file about to be attached, and fails the job (and so the release) if one has the mark.
      - name: Check that no release file is a test build
        run: node desktop/tests/packaging/check-release.mjs release
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          NAMED: ${{ inputs.release_tag }}
          BUILT_SHA: ${{ inputs.ref || github.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # Only a pushed desktop-v tag or a release named by upstream-watch gets here; anything else is a mistake, not a release.
          if [ -z "$NAMED" ] && [[ "$GITHUB_REF" != refs/tags/desktop-v* ]]; then echo "This run names no release." >&2; exit 1; fi
          # The update metadata is part of the release: a release without a file for an install type is never offered to it.
          test -f release/desktop-linux/latest-linux.yml
          test -f release/latest-mac.yml
          # A pushed tag already exists. For a named release the tag does not exist yet: the draft carries the commit, and publishing
          # creates the tag there. An earlier draft of the same name (an earlier run that nobody published) is replaced; a published
          # release is never touched, and the create below then fails.
          if [ -n "$NAMED" ]; then
            target=(--target "$BUILT_SHA")
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)" = true ]; then
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            fi
          else
            target=(--verify-tag)
          fi
          extra=()
          if [ "$PRERELEASE" = true ]; then extra+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft "${target[@]}" "${extra[@]}" \
            --title "opendoc-desktop ${TAG#desktop-v}" \
            --notes "Draft. Built from ${BUILT_SHA}. Read the files and the update metadata before publishing." \
            release/desktop-linux/* release/desktop-mac-*/* release/latest-mac.yml
