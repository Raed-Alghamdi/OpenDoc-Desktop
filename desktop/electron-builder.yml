# One config for every installer. Build it with `node runtime/dist.mjs`, which passes the build number from the runtime's
# build-info.json and adds `build:` and `commit:` to the update metadata afterwards.
appId: io.github.ryanyahya.OpenDocDesktop
productName: opendoc-desktop
executableName: opendoc-desktop
copyright: opendoc-desktop contributors. Built on OpenDoc, https://github.com/RyanYahya/OpenDoc
directories:
  output: dist
  buildResources: resources
files:
  - package.json
  - src/**
asar: true
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
# The build number: Arch pkgrel, Debian revision and RPM Release (fpm --iteration), the macOS bundle
# build number, and the file names. runtime/dist.mjs overrides this with the number the runtime was built with.
buildNumber: "1"
# Writes resources/app-update.yml, which the updater reads. The fork's releases, until releases move to the upstream project; the app can override
# the address in config.json.
publish:
  - provider: github
    owner: Raed-Alghamdi
    repo: OpenDoc-Desktop
# The runtime made by runtime/build.mjs on each platform's own machine. electron-builder always drops a root-level
# node_modules from a "from" folder, so the runtime's own node_modules is a second entry whose "from" is that folder itself.
# ${platform} is the build host's platform, so a macOS build must run on a Mac (the CI runners do).
extraResources:
  - from: build/runtime/${platform}-${arch}
    to: runtime
    filter: ["**/*", "!node_modules/**"]
  - from: build/runtime/${platform}-${arch}/node_modules
    to: runtime/node_modules
    filter: ["**/*"]
  # The AppImage's `opendoc` shim; the app writes it to ~/.local/bin/opendoc.
  - from: resources/cli
    to: cli
    filter: ["opendoc-appimage.sh"]
  # The agent integrations: the module copies this folder to the user's data folder and registers that copy.
  - from: integrations
    to: integrations
    filter: ["**/*"]
# Electron fuses. runAsNode stays on: the shim, the service host and render children need it.
electronFuses:
  runAsNode: true
  # Off (Electron's default). A cookie write hung in a VM desktop session with the fuse on
  # and off, so cookies stay unproven there; the app does not depend on them.
  enableCookieEncryption: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
linux:
  # The app icons (resources/icons/linux holds 16x16.png to 512x512.png; the scalable and symbolic SVGs sit beside it).
  icon: resources/icons/linux
  category: Office
  synopsis: OpenDoc on the desktop
  # The name the app menu and launchers show. productName stays opendoc-desktop: it names /opt/opendoc-desktop (which the polkit
  # action and the opendoc command use), the settings and data folders, the installer files and the AppImage the updater replaces.
  desktop:
    entry:
      Name: OpenDoc Desktop
  # The .desktop file's MimeType line. The type itself is defined by resources/mime/opendoc-desktop.xml, which the three fpm
  # targets below install; an AppImage cannot install it (docs/DESKTOP.md says what that means).
  mimeTypes: [application/x-opendoc-pack]
  # The root-owned helper the updater runs through pkexec (deb, rpm and pacman installs). Its polkit action
  # (resources/polkit, installed by the three fpm lists below) names this exact path, /opt/opendoc-desktop/resources/updater/install-update,
  # so the password prompt shows a sentence instead of a script. extraResources keeps the file's mode, 0755.
  # release-key.pem, the release public key, sits beside it: the helper checks every update's signature with it, and the app reads
  # the same file for the fallback script. Linux only (the macOS and AppImage updates check the SHA-512 only).
  extraResources:
    - from: resources/updater
      to: updater
      filter: ["install-update", "release-key.pem"]
  description: A self-contained desktop app for OpenDoc, built on the original OpenDoc project.
  maintainer: opendoc-desktop contributors <Raed-Alghamdi@users.noreply.github.com>
  vendor: opendoc-desktop contributors
  target:
    - target: pacman
    - target: deb
    - target: rpm
    - target: AppImage
# File names carry the build number, except the AppImage; fpm gets it as the package revision. Each follows its distribution's own convention.
# fpm also installs the scalable and symbolic icons (electron-builder only handles the sized PNGs) and the `opendoc` agent command
# (a real file in /usr/bin), mapped from desktop/.
# openssl checks the release signature of an update (the root helper runs it); the lists below are electron-builder's own defaults plus openssl.
deb:
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0, openssl]
  # Ubuntu 24.04 blocks unprivileged user namespaces without a profile (electron-builder issue 8635); 26.18.1 writes one by
  # default, and this template keeps it ours.
  appArmorProfile: resources/apparmor-profile.tpl
  artifactName: ${name}_${version}-${buildNumber}_${arch}.${ext}
  fpm:
    - resources/icons/opendoc-desktop.svg=/usr/share/icons/hicolor/scalable/apps/opendoc-desktop.svg
    - resources/icons/opendoc-desktop-symbolic.svg=/usr/share/icons/hicolor/symbolic/apps/opendoc-desktop-symbolic.svg
    - resources/cli/opendoc=/usr/bin/opendoc
    - resources/mime/opendoc-desktop.xml=/usr/share/mime/packages/opendoc-desktop.xml
    - resources/polkit/io.github.ryanyahya.opendocdesktop.install-update.policy=/usr/share/polkit-1/actions/io.github.ryanyahya.opendocdesktop.install-update.policy
pacman:
  # electron-builder's default list pulls http-parser and libappindicator-gtk3, which a bundled Electron does not need.
  depends: [gtk3, nss, libnotify, libxss, xdg-utils, at-spi2-core, openssl]
  artifactName: ${name}-${version}-${buildNumber}-${arch}.${ext}
  fpm:
    - resources/icons/opendoc-desktop.svg=/usr/share/icons/hicolor/scalable/apps/opendoc-desktop.svg
    - resources/icons/opendoc-desktop-symbolic.svg=/usr/share/icons/hicolor/symbolic/apps/opendoc-desktop-symbolic.svg
    - resources/cli/opendoc=/usr/bin/opendoc
    - resources/mime/opendoc-desktop.xml=/usr/share/mime/packages/opendoc-desktop.xml
    - resources/polkit/io.github.ryanyahya.opendocdesktop.install-update.policy=/usr/share/polkit-1/actions/io.github.ryanyahya.opendocdesktop.install-update.policy
rpm:
  depends: [gtk3, libnotify, nss, libXScrnSaver, (libXtst or libXtst6), xdg-utils, at-spi2-core, (libuuid or libuuid1), openssl]
  artifactName: ${name}-${version}-${buildNumber}.${arch}.${ext}
  fpm:
    - resources/icons/opendoc-desktop.svg=/usr/share/icons/hicolor/scalable/apps/opendoc-desktop.svg
    - resources/icons/opendoc-desktop-symbolic.svg=/usr/share/icons/hicolor/symbolic/apps/opendoc-desktop-symbolic.svg
    - resources/cli/opendoc=/usr/bin/opendoc
    - resources/mime/opendoc-desktop.xml=/usr/share/mime/packages/opendoc-desktop.xml
    - resources/polkit/io.github.ryanyahya.opendocdesktop.install-update.policy=/usr/share/polkit-1/actions/io.github.ryanyahya.opendocdesktop.install-update.policy
appImage:
  # No version in the name: electron-updater then replaces the file in place, so launchers and the opendoc shim keep working.
  artifactName: ${productName}-${arch}.${ext}
# The runtime is read-only, and codesign writes into the files it signs: on macOS these hooks open the runtime inside the .app just
# before signing and close it right after (runtime/mac-signing.mjs). They do nothing for the Linux builds.
afterPack: ./runtime/mac-signing.mjs
afterSign: ./runtime/mac-signing.mjs
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.productivity
  target:
    - target: zip
    - target: dmg
  identity: "-"
  notarize: false
  hardenedRuntime: true
  # A document type for design packs. macOS matches a file on its last extension only, so a `name.opendoc.zip` is a plain ZIP to
  # Launch Services and double-clicking it still goes to Archive Utility; this entry makes the app a valid target for Open With and for
  # `open -a`, and it works by itself if a later macOS honours the double extension. It never lists `zip`, `public.zip-archive` or any
  # system type, so ordinary ZIP files are not claimed (tests/packaging/file-type.test.mjs checks that).
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: OpenDoc design pack
        CFBundleTypeRole: Viewer
        LSHandlerRank: Owner
        LSItemContentTypes: [io.github.ryanyahya.OpenDocDesktop.pack]
    UTExportedTypeDeclarations:
      - UTTypeIdentifier: io.github.ryanyahya.OpenDocDesktop.pack
        UTTypeDescription: OpenDoc design pack
        UTTypeConformsTo: [public.zip-archive]
        UTTypeTagSpecification:
          public.filename-extension: [opendoc.zip]
          public.mime-type: [application/x-opendoc-pack]
  gatekeeperAssess: false
  # runtime/dist.mjs sets the real value from the runtime's build-info.json.
  bundleVersion: "1"
  artifactName: ${productName}-${version}-${buildNumber}-${arch}.${ext}
dmg:
  sign: false
