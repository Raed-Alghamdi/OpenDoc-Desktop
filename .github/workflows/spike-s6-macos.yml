name: Spike S6 macOS updates

# Throwaway spike workflow (never merged). It builds the opendoc-desktop spike shell twice (same version, build 1 and build 2,
# ad-hoc signed, no notarization), serves build 2 from a Python server on 127.0.0.1 inside the runner, and records whether an
# ad-hoc build 1 can download, check and swap in build 2 and restart, in Applications and in Downloads. Nothing is published.
# The push trigger lets it run from the spike branch without being on the default branch first.
on:
  workflow_dispatch:
  push:
    branches: [spike/s6-updates]
    paths: ['.github/workflows/spike-s6-macos.yml']

permissions:
  contents: read

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile

      - name: Build the runtime (plan 3.3 steps 1 and 2)
        run: pnpm --filter ./desktop run runtime

      - name: Build 1 and build 2 (same version, ad-hoc signed zip)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: |
          set -eo pipefail
          RT=build/runtime/darwin-${{ matrix.arch }}
          for N in 1 2; do
            python3 - "$RT/build-info.json" "$N" <<'PY'
          import json, sys
          p, n = sys.argv[1], int(sys.argv[2])
          j = json.load(open(p)); j['build'] = n
          json.dump(j, open(p, 'w'))
          PY
            cat "$RT/build-info.json"; echo
            pnpm exec electron-builder --mac zip --${{ matrix.arch }} --publish never \
              -c.mac.bundleVersion="$N" -c.directories.output="$PWD/dist-b$N" 2>&1 | tail -25
            ls -l "dist-b$N"
          done

      - name: Updates on macOS (Applications, Downloads, App Management, Gatekeeper)
        shell: bash
        run: desktop/scripts/spike-s6-mac-test.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: s6-mac-${{ matrix.arch }}
          path: ${{ runner.temp }}/s6-out/*.log
          retention-days: 5
