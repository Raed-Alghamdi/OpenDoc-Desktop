name: Desktop

# Builds the opendoc-desktop installers: pacman, deb, rpm and AppImage on Linux; zip and dmg for Apple Silicon and Intel Macs.
# A `desktop-v<version>-<build>` tag (for example desktop-v0.6.1-2) also creates a DRAFT release holding every file; publishing it
# stays a manual step. Other runs build and keep the files as artifacts for 5 days, and publish nothing.
on:
  push:
    tags: ['desktop-v*']
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
      - 'scripts/pack.mjs'
  workflow_dispatch:
    inputs:
      build:
        description: Build number for this run (a whole number)
        default: '1'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      # The build number reaches the runtime, the package revisions, the file names and the update metadata (contracts, "Version numbers").
      - name: Read the version and build number
        id: meta
        env:
          INPUT_BUILD: ${{ inputs.build }}
        run: node desktop/runtime/ci-meta.mjs
      - run: sudo apt-get update && sudo apt-get install -y rpm xvfb
      - name: Build the runtime
        run: node desktop/runtime/build.mjs --build "${{ steps.meta.outputs.build }}"
      - name: Test the runtime and the metadata scripts
        run: |
          node --test "desktop/tests/packaging/*.test.mjs"
          node --test desktop/tests/smoke/runtime.test.mjs
      # The shell's unit tests (no display needed). Here /bin/sh is dash, which the launcher and the host's watcher shell must run under.
      - name: Test the shell
        run: node desktop/tests/shell/run.mjs --unit
      - name: Build the installers
        run: node desktop/runtime/dist.mjs ${{ steps.meta.outputs.stub }} --linux pacman deb rpm AppImage --publish never
      - name: Check the installers
        run: node desktop/tests/packaging/check-artifacts.mjs --require-rpm
      - name: Test the runtime inside the unpacked app
        env:
          OPENDOC_RUNTIME: ${{ github.workspace }}/desktop/dist/linux-unpacked/resources/runtime
          OPENDOC_ELECTRON: ${{ github.workspace }}/desktop/dist/linux-unpacked/opendoc-desktop
        run: node --test desktop/tests/smoke/runtime.test.mjs
      # Ubuntu 24.04 stops unprivileged user namespaces, which the unpacked app's sandbox needs (no setuid chrome-sandbox there).
      # This runner is thrown away after the job.
      - name: Allow the app sandbox on this runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The packaged app (production fuses), driven on a virtual display: library, PDF, comment, export, `opendoc --version`, quit.
      - name: Smoke test the packaged app
        run: node desktop/tests/smoke/run.mjs
      - name: Sizes
        run: ls -l desktop/dist | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: |
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/*.pacman
            desktop/dist/*.AppImage
            desktop/dist/*.blockmap
            desktop/dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 5

  # The agent plugin files (desktop/integrations/, stream I). Needs Node 24 only: no install. The check script arrives with that
  # stream's branch; the step does nothing until the file exists, so remove the guard once it has merged.
  integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Check the plugin files
        run: |
          if [ -f desktop/integrations/check.mjs ]; then
            node desktop/integrations/check.mjs
          else
            echo "desktop/integrations/check.mjs is not here yet; skipped."
          fi

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      # The build number reaches the runtime, the package revisions, the file names and the update metadata (contracts, "Version numbers").
      - name: Read the version and build number
        id: meta
        env:
          INPUT_BUILD: ${{ inputs.build }}
        run: node desktop/runtime/ci-meta.mjs
      - name: Build the runtime
        run: node desktop/runtime/build.mjs --build "${{ steps.meta.outputs.build }}"
      - name: Test the runtime and the metadata scripts
        run: |
          node --test "desktop/tests/packaging/*.test.mjs"
          node --test desktop/tests/smoke/runtime.test.mjs
      # The shell's unit tests, run directly: tests/shell/run.mjs wraps them in ionice, which macOS does not have.
      - name: Test the shell
        run: node --test "desktop/tests/shell/unit/*.test.mjs"
      # Ad-hoc signed (identity "-", no notarization), as the config says; the first open on a Mac needs "Open Anyway" (plan 3.5).
      - name: Build zip and dmg
        run: node desktop/runtime/dist.mjs ${{ steps.meta.outputs.stub }} --mac zip dmg --${{ matrix.arch }} --publish never
      # The packaged app (production fuses) in the runner's own session: library, PDF, comment, export, `opendoc --version`, quit.
      - name: Smoke test the packaged app
        run: node desktop/tests/smoke/run.mjs
      - name: Sizes
        run: ls -l desktop/dist | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-${{ matrix.arch }}
          path: |
            desktop/dist/*.zip
            desktop/dist/*.dmg
            desktop/dist/*.blockmap
            desktop/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 5

  # Only for a desktop-v tag: a draft release. Nothing is published; the integrator reads it and publishes by hand.
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [linux, mac]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: release
      - name: Merge the macOS update metadata
        run: |
          node desktop/runtime/merge-mac-metadata.mjs release/latest-mac.yml release/desktop-mac-arm64/latest-mac.yml release/desktop-mac-x64/latest-mac.yml
          rm release/desktop-mac-arm64/latest-mac.yml release/desktop-mac-x64/latest-mac.yml
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The update metadata is part of the release: a release without a file for an install type is never offered to it.
          test -f release/desktop-linux/latest-linux.yml
          test -f release/latest-mac.yml
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "opendoc-desktop ${TAG#desktop-v}" \
            --notes "Draft. Built from ${GITHUB_SHA}. Read the files and the update metadata before publishing." \
            release/desktop-linux/* release/desktop-mac-*/* release/latest-mac.yml
